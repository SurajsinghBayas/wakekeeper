name: Feature idea
description: Suggest something WakeKeeper should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, e.g. "My render runs overnight and my laptop sleeps when the battery drops."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
